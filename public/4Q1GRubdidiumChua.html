<!DOCTYPE html>
<html>
<head>
<title>4Q1GRubidiumChua.html</title>

<style>
body{
font-family: Arial;
background: #381f1f;
color: white;
text-align: center;
padding: 40px;
}

.container{
background: #4f2f2f;
padding: 25px;
border-radius: 12px;
width: 420px;
margin: auto;
}

input,select{
padding: 8px;
border-radius: 6px;
border: none;
margin: 6px;
}

button{
padding: 10px 18px;
border: none;
border-radius: 8px;
background: #ffd24d;
font-weight: bold;
cursor: pointer;
}

.star{
font-size: 32px;
cursor: pointer;
color: gray;
}

.yellow{
color: gold;
}

ul{
list-style: none;
padding: 0;
}

li{
background: #633d3d;
padding: 10px;
margin: 10px;
border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h2>Movie Rating</h2>

<form onsubmit="addMovie(); return false;">

<input type="text" id="title" placeholder="Movie Title" required><br>

<select id="genre">
<option>Action</option>
<option>Comedy</option>
<option>Drama</option>
<option>Horror</option>
</select>

<br><br>

<div id="stars">
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
</div>

<br>

<button type="submit">Add Movie</button>

</form>

<hr>

<h3>Movie List</h3>
<ul id="movieList"></ul>

</div>

<script>

let rating = 0
let stars = document.querySelectorAll(".star")

stars.forEach((star, index) => {

    star.addEventListener("mouseover", () => {
        highlight(index + 1)
    })

    star.addEventListener("mouseout", () => {
        highlight(rating)
    })

    star.addEventListener("click", () => {
        rating = index + 1
        highlight(rating)
    })

})

function highlight(num){
    stars.forEach((s, i) => {
        if(i < num){
            s.classList.add("yellow")
        } else {
            s.classList.remove("yellow")
        }
    })
}

function getMovies(){
    let movies = localStorage.getItem("movies")
    return movies ? JSON.parse(movies) : []
}

function addMovie(){

    let title = document.getElementById("title").value
    let genre = document.getElementById("genre").value

    let movies = getMovies()

    let movie = {
        title : title,
        genre : genre,
        rating : rating
    }

    movies.push(movie)

    localStorage.setItem("movies", JSON.stringify(movies))

    displayMovies()

    document.getElementById("title").value = ""
    rating = 0
    highlight(0)
}

function displayMovies(){

    let movies = getMovies()
    let list = document.getElementById("movieList")

    list.innerHTML = ""

    movies.forEach(function(movie){

        let li = document.createElement("li")

        let starsDisplay = "★".repeat(movie.rating)

        li.innerHTML = movie.title + " (" + movie.genre + ") <span style='color : gold'>" + starsDisplay + "</span>"

        list.appendChild(li)

    })
}

displayMovies()

</script>

</body>
</html>
