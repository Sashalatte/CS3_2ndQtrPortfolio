<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3Q2GRubidiumChua.html</title>

<style>
  body { font-family: Arial, sans-serif; }

  form {
    width: 450px;
    margin: auto;
    padding: 20px;
    border: 2px solid #333;
  }

  fieldset {
    margin-bottom: 15px;
    padding: 15px;
  }

  label {
    display: block;
    margin-bottom: 10px;
  }

  input, select, textarea {
    width: 100%;
    padding: 6px;
  }

  input:focus, select:focus, textarea:focus {
    border: 2px solid blue;
    background-color: #eef;
  }

  textarea {
    resize: none;
  }

  .error {
    border: 2px solid red;
    background-color: #fdd;
  }

  button { margin-right: 8px; }

  .radio-group {
    display: flex;
    gap: 20px;
    margin-top: 5px;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 5px;
  }
</style>
</head>

<body onload="loadData()">

<form method="post" onsubmit="return submitForm(event);" onreset="return confirm('Do you want to reset the form?');">

  <fieldset>
    <legend>Personal Information</legend>

    <label>
      Student ID
      <input type="number" id="studentId" required onblur="checkEmpty(this)">
    </label>

    <label>
      Full Name
      <input type="text" id="name" required onblur="checkEmpty(this)">
    </label>

    <label>
      Email Address
      <input type="email" id="email" required onblur="checkEmpty(this)">
    </label>
  </fieldset>

  <fieldset>
    <legend>Other Information</legend>

    <label>
      Mobile Phone
      <input type="text" id="phone" required onblur="checkEmpty(this)">
    </label>

    <label>
      Grade Level
      <select id="grade" required>
        <option value="">Select</option>
        <option value="g7">Grade 7</option>
        <option value="g8">Grade 8</option>
        <option value="g9">Grade 9</option>
        <option value="g10">Grade 10</option>
        <option value="g10">Grade 11</option>
        <option value="g10">Grade 12</option>
      </select>
    </label>

    <label>
      Intern / Extern
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="role" value="intern" required>
          Intern
        </label>
        <label class="radio-option">
          <input type="radio" name="role" value="extern">
          Extern
        </label>
      </div>
    </label>

    <label>
      Preferred Organization / Club
      <select id="club" required>
        <option value="">Select</option>
        <option value="CS">CS Club</option>
        <option value="Science">Science Club</option>
        <option value="Art">Art Club</option>
        <option value="Math">Math Club</option>
        <option value="Music">Music Club</option>
      </select>
    </label>

    <label>
      Why do you want to join
      <textarea id="reason" required onblur="checkEmpty(this)"></textarea>
    </label>
  </fieldset>

  <button type="submit">Submit</button>
  <button type="reset">Reset</button>
  <button type="button" onclick="saveData()">Save</button>
  <button type="button" onclick="clearData()">Clear</button>
  <button type="button" onclick="viewSignUps()">View Signups</button>

</form>

<script>
function checkEmpty(el){
  if (!el.value.trim()) el.classList.add("error");
  else el.classList.remove("error");
}

function submitForm(event){
  event.preventDefault();
  if (!confirm("do you want to submit this application?")) return false;

  const signup = {
    studentId: studentId.value,
    name: name.value,
    email: email.value,
    phone: phone.value,
    grade: grade.value,
    club: club.value,
    reason: reason.value,
    role: document.querySelector('input[name="role"]:checked').value
  };

  let list = JSON.parse(localStorage.getItem("signups"));
  if (!list) list = [];
  list.push(signup);
  localStorage.setItem("signups", JSON.stringify(list));
  alert("Application submitted!")
  return false;
}

function loadData() {}

function clearData() {
  document.querySelector("form").reset();
}

function viewSignUps() {
  window.location.href = "viewSignUps.html";
}

</script>

</body>
</html>
